[build]
  publish = "."

# ── Security headers (all routes) ────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.plot.ly https://www.gstatic.com https://apis.google.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://query1.finance.yahoo.com https://api.allorigins.win https://www.alphavantage.co https://generativelanguage.googleapis.com https://*.firebaseio.com https://*.googleapis.com; img-src 'self' data:; frame-src 'none'; worker-src 'self';"

# ── Long cache for versioned static assets ────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# ── No-cache for HTML so users always get the latest app shell ────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# ── PWA service worker must never be cached ───────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
